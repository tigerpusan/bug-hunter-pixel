name: Build BUG HUNTER Play AAB

on:
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create isolated Android project
        run: flutter create . --platforms=android --org com.pinetreelabs --project-name bug_hunter_pixel

      - name: Lock Play package id
        run: |
          sed -i 's/com.pinetreelabs.bug_hunter_pixel/com.pinetreelabs.bughunter/g' android/app/build.gradle.kts
          grep -q 'applicationId = "com.pinetreelabs.bughunter"' android/app/build.gradle.kts
          grep -q 'namespace = "com.pinetreelabs.bughunter"' android/app/build.gradle.kts

      - name: Apply app name and icons
        run: |
          sed -i 's/android:label="bug_hunter_pixel"/android:label="버그헌터"/' android/app/src/main/AndroidManifest.xml
          cp assets/android_icons/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/android_icons/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/android_icons/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/android_icons/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/android_icons/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Verify signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.BUG_HUNTER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BUG_HUNTER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUG_HUNTER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUG_HUNTER_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing BUG_HUNTER_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing BUG_HUNTER_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing BUG_HUNTER_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing BUG_HUNTER_KEY_PASSWORD" && exit 1)

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BUG_HUNTER_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUG_HUNTER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUG_HUNTER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUG_HUNTER_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          if 'java.util.Properties' not in s:
              s = 'import java.util.Properties\nimport java.io.FileInputStream\n' + s
          marker = 'android {'
          inject = '''\nval keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n}\n\n'''
          s = s.replace(marker, inject + marker, 1)
          android_marker = 'android {\n'
          signing = '''android {\n    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = file(keystoreProperties["storeFile"] as String)\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n'''
          s = s.replace(android_marker, signing, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Run app test
        run: flutter test test/basic_app_test.dart

      - name: Build signed release AAB
        run: flutter build appbundle --release

      - name: Verify AAB exists
        run: test -f build/app/outputs/bundle/release/app-release.aab

      - name: Rename AAB
        run: cp build/app/outputs/bundle/release/app-release.aab BUG_HUNTER_V1.3.3_PLAY.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: BUG_HUNTER_V1.3.3_PLAY-aab
          path: BUG_HUNTER_V1.3.3_PLAY.aab
          retention-days: 30
