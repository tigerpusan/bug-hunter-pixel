<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>버그헌터</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:ui-monospace,"SFMono-Regular",Consolas,"Noto Sans KR",monospace;touch-action:none;background:#1b211d;image-rendering:pixelated}
#game{position:relative;height:100%;overflow:hidden;background:url('../game_art/backgrounds/game_bg_day.png') center/cover no-repeat;image-rendering:pixelated}
#game:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,0) 46%,rgba(0,0,0,.12) 100%);pointer-events:none}
#game:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,rgba(0,0,0,.018) 1px 2px);mix-blend-mode:overlay;pointer-events:none;z-index:2}
#hud{position:absolute;left:8px;right:8px;top:8px;display:grid;grid-template-columns:1.45fr 1fr 1fr .95fr;gap:5px;z-index:50}
.hudCell{min-height:58px;display:flex;align-items:center;justify-content:center;background:#172018;border:3px solid #0a0d0b;outline:2px solid #6f765f;color:#fff;box-shadow:4px 5px 0 rgba(0,0,0,.38)}
.hudStat{flex-direction:column;padding:7px 5px 5px;gap:1px;overflow:hidden}
.hudStat .label{font-size:10px;font-weight:1000;letter-spacing:1px;color:#c9c8a0;text-shadow:2px 2px 0 #000}
.hudStat .value{font-size:clamp(15px,3.9vw,23px);font-weight:1000;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:2px 2px 0 #000}
#scoreWrap .value{font-size:clamp(18px,4.6vw,29px);color:#ffd24a}
#timeWrap .value{color:#fff074}
#missWrap .value{color:#ff6658;letter-spacing:1px}
#banner{position:absolute;left:50%;top:80px;transform:translateX(-50%);z-index:46;background:#f2d45c;color:#211d0e;padding:8px 14px;border:3px solid #211d0e;box-shadow:4px 4px 0 rgba(0,0,0,.32);font-weight:1000;font-size:14px;white-space:nowrap}
#message{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:45;min-width:230px;max-width:86%;padding:10px 14px;text-align:center;background:#172018;border:3px solid #0a0d0b;outline:2px solid #6f765f;color:#fff;box-shadow:4px 4px 0 rgba(0,0,0,.38);font-size:13px;font-weight:1000;text-shadow:2px 2px 0 #000}
#cross{position:absolute;z-index:42;width:54px;height:54px;border:4px solid #f34e3d;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(2px 2px 0 #151515)}
#cross:before,#cross:after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#f34e3d}
#cross:before{width:76px;height:4px}#cross:after{width:4px;height:76px}
#cross .dot{position:absolute;left:50%;top:50%;width:10px;height:10px;transform:translate(-50%,-50%);background:#fff;border:3px solid #f34e3d;border-radius:50%}
#rifleWrap{--ang:0deg;--weapon-x:50%;--weapon-bottom:-24px;--weapon-width:126px;position:absolute;left:var(--weapon-x);bottom:var(--weapon-bottom);width:var(--weapon-width);height:224px;transform:translateX(-50%) rotate(var(--ang));transform-origin:50% 100%;pointer-events:none;z-index:40;filter:drop-shadow(4px 7px 0 rgba(0,0,0,.38));image-rendering:pixelated}
#rifleImg{position:absolute;left:0;bottom:0;width:100%;height:auto;image-rendering:pixelated}
#rifleWrap.kick{animation:kick .10s steps(2,end)}
@keyframes kick{0%,100%{transform:translateX(-50%) rotate(var(--ang))}50%{transform:translateX(-50%) translateY(7px) rotate(calc(var(--ang) + 1deg))}}
#muzzleFlash{position:absolute;left:50%;top:1px;width:44px;height:44px;transform:translateX(-50%) scale(.55);opacity:0;clip-path:polygon(50% 0,62% 31%,100% 18%,70% 50%,100% 76%,62% 68%,50% 100%,38% 68%,0 80%,29% 50%,0 20%,38% 31%);background:#ffd12e;box-shadow:inset 0 0 0 7px #fff4a1}
#rifleWrap.fire #muzzleFlash{animation:flash .11s steps(2,end)}
@keyframes flash{0%{opacity:0;transform:translateX(-50%) scale(.5)}35%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(1.25)}}
.pest{position:absolute;z-index:34;transform:translate(-50%,-50%);filter:drop-shadow(3px 4px 0 rgba(0,0,0,.42));image-rendering:pixelated}
.pest img.sprite{display:block;width:100%;height:auto;pointer-events:none;user-select:none;image-rendering:pixelated}
.pest .no{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);min-width:22px;height:22px;padding:0 3px;background:#f5ead1;border:3px solid #251e16;color:#171512;font-size:12px;line-height:16px;font-weight:1000;text-align:center;box-shadow:2px 2px 0 rgba(0,0,0,.35)}
.pest.mosquito .no{top:50%}.pest.moth .no{top:52%}
.hitFx{position:absolute;width:32px;height:32px;transform:translate(-50%,-50%);pointer-events:none;z-index:70;background:#ffcf33;clip-path:polygon(50% 0,62% 33%,100% 17%,70% 50%,100% 83%,62% 67%,50% 100%,38% 67%,0 83%,30% 50%,0 17%,38% 33%);box-shadow:inset 0 0 0 7px #fff3a8;animation:hitBurst .22s steps(3,end) forwards}
@keyframes hitBurst{0%{opacity:1;transform:translate(-50%,-50%) scale(.45)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.45)}}
.hitText{position:absolute;transform:translate(-50%,-50%);font-weight:1000;font-size:18px;color:#ffd84a;text-shadow:3px 3px 0 #000;pointer-events:none;z-index:72;animation:floatText .52s steps(5,end) forwards}
@keyframes floatText{0%{opacity:0;transform:translate(-50%,-35%) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-115%) scale(1.08)}}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(8,10,8,.64);z-index:100}
#overlay .card{width:min(92vw,350px);padding:22px 18px;background:#171b18;border:4px solid #080a08;outline:3px solid #6f765f;text-align:center;color:#fff;box-shadow:8px 8px 0 rgba(0,0,0,.42)}
#overlay .card.fail{background:#211515;outline-color:#8f4a3f}
#ovIcon{font-size:34px;margin-bottom:5px}#ovTitle{margin:0 0 10px;font-size:30px;font-weight:1000;color:#ffd449;text-shadow:3px 3px 0 #000}#ovText{margin:0;font-size:14px;line-height:1.55;color:#e8e1c9;white-space:pre-line}.card.fail #ovTitle{color:#ff5c46}.card.fail #ovText{color:#ffd6cf}
.actions{display:flex;gap:10px;justify-content:center;margin-top:18px}.actions button{border:3px solid #111;padding:12px 14px;font-weight:1000;font-size:14px;box-shadow:3px 3px 0 rgba(0,0,0,.38)}.actions .primary{background:#f0c532;color:#17140b}.actions .secondary{background:#3c4d3b;color:#fff;border-color:#161b15}
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div id="stageWrap" class="hudCell hudStat"><span class="label">WAVE</span><span class="value" id="waveLabel">파리 1단계</span></div>
    <div id="scoreWrap" class="hudCell hudStat"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
    <div id="missWrap" class="hudCell hudStat"><span class="label">MISS</span><span class="value" id="missDots">○○○</span></div>
    <div id="timeWrap" class="hudCell hudStat"><span class="label">TIME</span><span class="value" id="timeLeft">10.0s</span></div>
  </div>
  <div id="banner">1마리 출현!</div>
  <div id="cross"><span class="dot"></span></div>
  <div id="rifleWrap"><div id="muzzleFlash"></div><img id="rifleImg" src="../game_art/weapons/rifle.png" alt="rifle"></div>
  <div id="message">1번부터 차례대로 박멸하세요</div>
  <div id="overlay"><div class="card" id="ovCard"><div id="ovIcon">⭐</div><h2 id="ovTitle">박멸 성공!</h2><p id="ovText">다음 해충 떼가 감지되었습니다.</p><div class="actions"><button class="primary" id="retryBtn">다음 단계</button><button class="secondary" id="resetBtn">처음부터</button></div></div></div>
</div>
<script>
// V1.3.1 FLOW & SPRITE FIX: V1.2.1 gameplay/visual tuning preserved.
// Campaign: fly 8 -> mosquito 8 -> moth 8 -> mixed 15.
// After campaign clear, endless random mixed waves continue without runaway speed scaling.
const GAME_CONFIG={
  maxVisiblePests:8,
  missLimit:3,
  campaignStages:{fly:8,mosquito:8,moth:8,mixed:15},
  endless:{minCount:4,maxCount:8,eliteRatio:.25,eliteSpeedMin:1.08,eliteSpeedMax:1.16,restEvery:5},
  playArea:{sidePadding:32,minTop:128,hudGap:26,bannerGap:20,maxHeightRatio:.60,weaponReserve:238,minHeight:80},
  weapon:{anchorX:'50%',bottom:-24,width:126,minAimDy:155,angleFactor:.42},
  pests:{
    fly:{sprite:'../game_art/pests/fly.png',spriteWidth:56,hitRadius:30},
    mosquito:{sprite:'../game_art/pests/mosquito.png',spriteWidth:56,hitRadius:24},
    moth:{sprite:'../game_art/pests/moth.png',spriteWidth:64,hitRadius:38}
  }
};
const ACTS=[
  {name:'파리',key:'fly',color:'#ff8d76',stages:GAME_CONFIG.campaignStages.fly},
  {name:'모기',key:'mosquito',color:'#5bc8ff',stages:GAME_CONFIG.campaignStages.mosquito},
  {name:'나방',key:'moth',color:'#ffd36f',stages:GAME_CONFIG.campaignStages.moth},
  {name:'혼합',key:'mixed',color:'#69d77f',stages:GAME_CONFIG.campaignStages.mixed}
];
const TOTAL_CAMPAIGN_STAGES=ACTS.reduce((sum,a)=>sum+a.stages,0);
const SPRITES=Object.fromEntries(Object.entries(GAME_CONFIG.pests).map(([key,value])=>[key,value.sprite]));
const game=document.getElementById('game');
const hud=document.getElementById('hud');
const cross=document.getElementById('cross');
const rifle=document.getElementById('rifleWrap');
const overlay=document.getElementById('overlay');
const ovCard=document.getElementById('ovCard');
const ovTitle=document.getElementById('ovTitle');
const ovText=document.getElementById('ovText');
const ovIcon=document.getElementById('ovIcon');
const scoreEl=document.getElementById('score');
const waveLabel=document.getElementById('waveLabel');
const timeLeftEl=document.getElementById('timeLeft');
const missDotsEl=document.getElementById('missDots');
const banner=document.getElementById('banner');
const messageEl=document.getElementById('message');
const retryBtn=document.getElementById('retryBtn');
const resetBtn=document.getElementById('resetBtn');
let wave=1, score=0, misses=0, pests=[], transitioning=false, running=true, last=performance.now(), timerHandle=null, stageDeadline=0, sessionStarted=false;
let audioCtx=null;
function ensureAudio(){ if(!audioCtx){ const C=window.AudioContext||window.webkitAudioContext; if(C) audioCtx=new C(); } if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); }
function ping(freq,dur,type='square',gain=.03,start=0){ if(!audioCtx) return; const t=audioCtx.currentTime+start; const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(gain,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+dur+.03); }
function noiseBurst(dur=.08,gain=.018,start=0,lowpass=null){ if(!audioCtx) return; const buffer=audioCtx.createBuffer(1, audioCtx.sampleRate*dur, audioCtx.sampleRate); const data=buffer.getChannelData(0); for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*(1-i/data.length); const src=audioCtx.createBufferSource(); src.buffer=buffer; const g=audioCtx.createGain(); const t=audioCtx.currentTime+start; g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); if(lowpass){ const f=audioCtx.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(lowpass,t); src.connect(f); f.connect(g); } else src.connect(g); g.connect(audioCtx.destination); src.start(t); }
function playShot(){ ensureAudio(); ping(95,.055,'triangle',.08,0); ping(82,.11,'sine',.06,.006); noiseBurst(.10,.048,0); noiseBurst(.05,.035,.012,980); }
function playHit(){ ensureAudio(); ping(720,.05,'triangle',.04,0); ping(960,.07,'sine',.025,.02); }
function playMiss(){ ensureAudio(); ping(180,.08,'sawtooth',.03,0); }
function playWaveClear(){ ensureAudio(); ping(660,.06,'sine',.03,0); ping(880,.07,'sine',.03,.05); ping(1160,.08,'sine',.025,.1); }
function playFail(){ ensureAudio(); ping(200,.1,'sawtooth',.04,0); ping(160,.14,'triangle',.035,.05); }
function bounds(){ return game.getBoundingClientRect(); }
function playArea(){ const r=bounds(); const c=GAME_CONFIG.playArea; const hudBottom=hud.offsetTop+hud.offsetHeight; const top=Math.max(c.minTop,hudBottom+c.hudGap,banner.offsetTop+banner.offsetHeight+c.bannerGap); const bottom=Math.min(r.height*c.maxHeightRatio,r.height-c.weaponReserve); return {xMin:c.sidePadding,xMax:r.width-c.sidePadding,yMin:top,yMax:Math.max(top+c.minHeight,bottom)}; }
function actOf(stage){
  let cursor=0;
  for(let i=0;i<ACTS.length;i++){
    const next=cursor+ACTS[i].stages;
    if(stage<=next) return {act:ACTS[i],index:i,level:stage-cursor,endless:false};
    cursor=next;
  }
  return {act:{name:'무한 혼합',key:'mixed',color:'#9ee493'},index:ACTS.length,level:stage-TOTAL_CAMPAIGN_STAGES,endless:true};
}
function stageCount(level, meta=null){
  if(meta?.endless){
    const e=GAME_CONFIG.endless;
    if(level%e.restEvery===0) return 4+Math.floor(Math.random()*2); // periodic breather wave
    return e.minCount+Math.floor(Math.random()*(e.maxCount-e.minCount+1));
  }
  // Single-species acts end at stage 8, so the 8-pest wave appears only once before the next insect begins.
  if(meta?.act?.key!=='mixed') return Math.min(8, Math.max(1, level));
  // Mixed stages continue to 15, but after the first 8-pest peak, vary 6/7/8 instead of repeating 8 every stage.
  if(level<=8) return level;
  return 6+((level-9)%3);
}
function stageSeconds(level, actKey, endless=false){
  if(endless) return 22; // same late mixed-stage time; endless does not tighten the clock further
  const base=level<=2?12:level<=5?15:level<=8?18:20;
  return actKey==='mixed'?base+2:base;
}
function expectedNo(){ const alive=pests.filter(p=>p.alive).map(p=>p.no); return alive.length?Math.min(...alive):null; }
function saveRecord(key,val){ localStorage.setItem(key,String(val)); }
function getNum(key){ return Number(localStorage.getItem(key)||0); }
function rememberProgress(){ if(score>getNum('pest_best_score')) saveRecord('pest_best_score',score); if(wave>getNum('pest_best_wave')) saveRecord('pest_best_wave',wave); }
function recordKill(){ saveRecord('pest_total_kills', getNum('pest_total_kills')+1); }
function updateHud(){ const meta=actOf(wave); waveLabel.textContent=meta.endless?'무한 '+meta.level+'단계':meta.act.name+' '+meta.level+'단계'; scoreEl.textContent=score; missDotsEl.textContent=[0,1,2].map(i=>i<misses?'●':'○').join(''); }
function showBanner(text){ banner.textContent=text; banner.animate([{transform:'translateX(-50%) scale(.84)',opacity:.2},{transform:'translateX(-50%) scale(1)',opacity:1}],{duration:220,fill:'forwards'}); }
function setMessage(text){ messageEl.textContent=text; }
function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } }
function startTimer(){ stopTimer(); const meta=actOf(wave); const sec=stageSeconds(meta.level,meta.act.key,meta.endless); stageDeadline=performance.now()+sec*1000; timeLeftEl.textContent=sec.toFixed(1)+'s'; timerHandle=setInterval(()=>{ if(transitioning) return; const left=Math.max(0,(stageDeadline-performance.now())/1000); timeLeftEl.textContent=left.toFixed(1)+'s'; if(left<=0){ stopTimer(); failStage('시간 안에 해충을 정리하지 못했어요.'); } },100); }
function pestHtml(type,no){ return '<img class="sprite" src="'+SPRITES[type]+'" alt="'+type+'"><div class="no">'+no+'</div>'; }
function createPestType(meta, idx){
  if(meta.act.key!=='mixed') return meta.act.key;
  if(meta.endless){
    const pool=['fly','mosquito','moth'];
    // Make every endless wave genuinely mixed: seed first three slots, then randomize the rest.
    if(idx<3) return pool[(idx+meta.level)%3];
    return pool[Math.floor(Math.random()*pool.length)];
  }
  if(meta.level<=3) return idx%2===0?'fly':'mosquito';
  if(meta.level<=6) return ['fly','mosquito','moth'][idx%3];
  return ['mosquito','fly','moth'][Math.floor(Math.random()*3)];
}
function motionProfile(type, level){
  // Mosquito remains agile but no longer jumps to an extreme speed by stage 8.
  if(type==='mosquito') return {speed:205+level*11, turn:4.55+level*0.15, wiggle:21+level*1.1, bob:9+level*0.4, jitter:42+level*2.2};
  // Moth is the large, readable target: slower translation with a broad floating motion.
  if(type==='moth') return {speed:112+level*7, turn:1.95+level*0.05, wiggle:15+level*.5, bob:16+level*.65, jitter:10+level*.3};
  // Fly base movement stays deliberately stable. Per-fly difficulty is layered in flyDifficulty().
  return {speed:158, turn:3.35, wiggle:19, bob:16, jitter:16};
}
function flyDifficulty(level, index, count){
  // L1: all normal.
  if(level<=1) return {speed:1, turn:1, wiggle:1};

  // L2-L5: never raise the whole swarm. Keep one normal fly and gradually add mildly faster flies.
  if(level<=5){
    if(index===0) return {speed:1, turn:1, wiggle:1};
    const rank=index; // later-number flies are a little quicker, but boosts remain modest.
    const speed=Math.min(1.18, 1.07 + Math.max(0,rank-1)*0.025);
    const turn=Math.min(1.10, 1.025 + Math.max(0,rank-1)*0.015);
    return {speed, turn, wiggle:1.02};
  }

  // L6-L10: only about 20-30% of flies keep scaling up. The rest stay near the L5 band.
  const eliteCount=Math.max(1, Math.round(count*0.25));
  const eliteStart=count-eliteCount;
  if(index>=eliteStart){
    const late=(level-6)/4; // 0.0 at L6 -> 1.0 at L10
    return {speed:1.20 + late*0.12, turn:1.10 + late*0.08, wiggle:1.06 + late*0.04};
  }
  const mild=1.08 + ((index%3)*0.025);
  return {speed:mild, turn:1.035, wiggle:1.02};
}
function endlessTune(meta,index,count,type){
  if(!meta.endless) return {speed:1,turn:1,wiggle:1};
  const e=GAME_CONFIG.endless;
  if(meta.level%e.restEvery===0) return {speed:.96,turn:.97,wiggle:.98};
  const eliteCount=Math.max(1,Math.round(count*e.eliteRatio));
  const elite=index>=count-eliteCount;
  if(!elite) return {speed:1,turn:1,wiggle:1};
  const spread=(index-(count-eliteCount))/Math.max(1,eliteCount-1);
  const speed=e.eliteSpeedMin+(e.eliteSpeedMax-e.eliteSpeedMin)*spread;
  return {speed,turn:1.04+spread*.03,wiggle:1.02};
}
function spawnStage(){
  pests.forEach(p=>p.el.remove()); pests=[]; misses=0; overlay.style.display='none'; transitioning=false; running=true; updateHud();
  const meta=actOf(wave); const count=stageCount(meta.level,meta); const r=bounds(); const area=playArea();
  for(let i=0;i<count;i++){
    const type=createPestType(meta,i); const el=document.createElement('div'); el.className='pest '+type; el.style.width=GAME_CONFIG.pests[type].spriteWidth+'px'; el.innerHTML=pestHtml(type,i+1); game.appendChild(el);
    const motionLevel=meta.endless?Math.min(8,5+((meta.level-1)%4)):Math.min(meta.level,8);
    const prof=motionProfile(type,motionLevel);
    const flyTune=type==='fly'?flyDifficulty(Math.min(meta.level,10),i,count):{speed:1,turn:1,wiggle:1};
    const eTune=endlessTune(meta,i,count,type);
    const speedVariance=type==='fly'?(0.97+Math.random()*0.06):(0.94+Math.random()*0.12);
    const angle=Math.random()*Math.PI*2;
    pests.push({el,alive:true,no:i+1,type,x:42+Math.random()*(r.width-84),y:area.yMin+Math.random()*(area.yMax-area.yMin),angle,targetAngle:angle,speed:prof.speed*flyTune.speed*eTune.speed*speedVariance,turnRate:prof.turn*flyTune.turn*eTune.turn,wiggle:prof.wiggle*flyTune.wiggle*eTune.wiggle,bob:prof.bob,jitter:prof.jitter,phase:Math.random()*Math.PI*2,changeIn:type==='mosquito'?(.10+Math.random()*.12):(.30+Math.random()*.44)});
  }
  const bannerText=meta.endless?'무한 혼합 '+meta.level+'단계 · '+count+'마리':meta.act.name+(count>1?' '+count+'마리 출현!':' 1마리 출현!');
  showBanner(bannerText); setMessage(meta.endless?'랜덤 혼합 웨이브 · 1번부터 맞히세요':'1번부터 맞히세요'); startTimer(); if(!sessionStarted){ sessionStarted=true; ensureAudio(); }
}
function openResult(success,message){ transitioning=true; running=false; stopTimer(); overlay.style.display='flex'; if(success){ ovCard.classList.remove('fail'); ovIcon.textContent='⭐'; ovTitle.textContent='박멸 성공!'; ovText.textContent=message; retryBtn.textContent='다음 단계'; resetBtn.textContent='처음부터'; } else { ovCard.classList.add('fail'); ovIcon.textContent='💥'; ovTitle.textContent='GAME OVER'; ovText.textContent=message; retryBtn.textContent='다시 하기'; resetBtn.textContent='처음부터'; } }
function nextStage(){
  rememberProgress();
  if(wave===TOTAL_CAMPAIGN_STAGES){
    wave++;
    showBanner('전체 단계 완료! 무한 혼합 시작');
    setTimeout(spawnStage,360);
    return;
  }
  wave++;
  spawnStage();
}
function failStage(reason){
  playFail(); rememberProgress(); const meta=actOf(wave);
  const retryWave=meta.endless?Math.max(TOTAL_CAMPAIGN_STAGES+1,wave-2):Math.max(1,wave-2);
  overlay.dataset.retryWave=String(retryWave); openResult(false,reason+'\n게임이 끝났습니다.');
}
function fireFx(x,y,text,kind='hit'){ const flash=document.createElement('div'); flash.className='hitFx'; flash.style.left=x+'px'; flash.style.top=y+'px'; game.appendChild(flash); setTimeout(()=>flash.remove(),220); const t=document.createElement('div'); t.className='hitText'; t.style.left=x+'px'; t.style.top=y+'px'; t.textContent=text; game.appendChild(t); setTimeout(()=>t.remove(),560); rifle.classList.remove('kick','fire'); void rifle.offsetWidth; rifle.classList.add('kick','fire'); setTimeout(()=>rifle.classList.remove('fire'),130); if(kind==='hit') playHit(); else playMiss(); }
function shoot(x,y){ ensureAudio(); playShot(); aimAt(x,y); if(transitioning||!running) return; const nearest=pests.filter(p=>p.alive).map(p=>({p,d:Math.hypot(p.x-x,p.y-y)})).sort((a,b)=>a.d-b.d)[0]; const hitRadius = nearest ? GAME_CONFIG.pests[nearest.p.type].hitRadius : GAME_CONFIG.pests.fly.hitRadius; if(nearest&&nearest.d<hitRadius){ const need=expectedNo(); if(nearest.p.no!==need){ misses++; updateHud(); setMessage(need+'번을 먼저 맞히세요'); fireFx(x,y,'MISS','miss'); if(misses>=GAME_CONFIG.missLimit) failStage('번호 순서를 놓쳤어요.'); return; } nearest.p.alive=false; nearest.p.el.remove(); const scoreMeta=actOf(wave); const scoreLevel=scoreMeta.endless?10+Math.min(10,Math.floor((scoreMeta.level-1)/5)):scoreMeta.level; score += 100*scoreLevel+(scoreMeta.index*100); recordKill(); updateHud(); setMessage('다음 번호를 노리세요'); fireFx(nearest.p.x,nearest.p.y,'HIT!','hit'); if(pests.every(p=>!p.alive)){ playWaveClear(); setTimeout(nextStage,360); } } else { misses++; updateHud(); setMessage('MISS'); fireFx(x,y,'MISS','miss'); if(misses>=GAME_CONFIG.missLimit) failStage('MISS가 3회 누적되었어요.'); } }
function aimAt(x,y){ const area=playArea(); x=Math.max(area.xMin,Math.min(area.xMax,x)); y=Math.max(area.yMin,Math.min(area.yMax,y)); cross.style.left=x+'px'; cross.style.top=y+'px'; const r=bounds(); const w=GAME_CONFIG.weapon; const dx=x-r.width/2; const dy=Math.max(w.minAimDy,r.height-y); const ang=(Math.atan2(dx,dy)*180/Math.PI)*w.angleFactor; rifle.style.setProperty('--ang',ang+'deg'); }
function loop(now){ const dt=Math.min(.03,(now-last)/1000); last=now; if(running){ const area=playArea(); pests.filter(p=>p.alive).forEach(p=>{ p.phase += dt*(4.8 + p.turnRate*.65); p.changeIn -= dt; if(p.changeIn<=0){ p.targetAngle += (Math.random()*2-1)*(0.86 + p.turnRate*.16); p.changeIn = p.type==='mosquito' ? (0.07 + Math.random()*.11) : (0.20 + Math.random()*.34); }
      let diff=((p.targetAngle-p.angle+Math.PI*3)%(Math.PI*2))-Math.PI;
      p.angle += diff * Math.min(1, dt*(2.8 + p.turnRate));
      const vx=Math.cos(p.angle)*p.speed;
      const vy=Math.sin(p.angle)*p.speed*0.72;
      p.x += vx*dt + Math.sin(p.phase)*(p.wiggle*1.1)*dt + (p.type==='mosquito' ? Math.sin(p.phase*8.4)*p.jitter*dt : 0);
      p.y += vy*dt + Math.cos(p.phase*1.4)*p.bob*dt + (p.type==='mosquito' ? Math.cos(p.phase*7.6)*(p.jitter*0.48)*dt : 0);
      if(p.x<area.xMin || p.x>area.xMax){ p.x=Math.max(area.xMin,Math.min(area.xMax,p.x)); p.targetAngle=Math.PI-p.targetAngle; p.angle=Math.PI-p.angle; }
      if(p.y<area.yMin || p.y>area.yMax){ p.y=Math.max(area.yMin,Math.min(area.yMax,p.y)); p.targetAngle=-p.targetAngle; p.angle=-p.angle; }
      pests.filter(q=>q!==p && q.alive).forEach(q=>{ const dx=p.x-q.x, dy=p.y-q.y; const dist=Math.hypot(dx,dy); if(dist>0 && dist<42){ p.x += (dx/dist)*30*dt; p.y += (dy/dist)*20*dt; } });
      p.el.style.left=p.x+'px'; p.el.style.top=p.y+'px';
      const rot=Math.sin(p.phase*2.3)*8 + (p.type==='mosquito'?11: p.type==='moth'?4:6);
      const scale=(1+Math.sin(p.phase*6)*(p.type==='mosquito'?0.05:0.03)).toFixed(3);
      p.el.style.transform='translate(-50%,-50%) rotate('+rot+'deg) scale('+scale+')';
    }); }
  requestAnimationFrame(loop);
}
game.addEventListener('pointermove',e=>{ const r=bounds(); aimAt(e.clientX-r.left,e.clientY-r.top); });
game.addEventListener('pointerdown',e=>{ if(e.target.closest('#overlay')) return; const r=bounds(); shoot(e.clientX-r.left,e.clientY-r.top); });
retryBtn.addEventListener('click',()=>{ ensureAudio(); if(retryBtn.textContent==='다음 단계'){ overlay.style.display='none'; transitioning=false; running=true; spawnStage(); } else { wave=Number(overlay.dataset.retryWave||wave); spawnStage(); } });
resetBtn.addEventListener('click',()=>{ ensureAudio(); wave=1; score=0; misses=0; sessionStarted=false; updateHud(); spawnStage(); });
const weaponCfg=GAME_CONFIG.weapon; rifle.style.setProperty('--weapon-x',weaponCfg.anchorX); rifle.style.setProperty('--weapon-bottom',weaponCfg.bottom+'px'); rifle.style.setProperty('--weapon-width',weaponCfg.width+'px');
const r=bounds(); aimAt(r.width/2,r.height*0.50); updateHud(); spawnStage(); requestAnimationFrame(loop);
</script>
</body>
